name: Warning Budget

on:
  pull_request:
  push:
    branches:
      - bugfix
      - main

jobs:
  source-warnings:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Enforce source warning budget
        run: Scripts/check-source-warnings.sh
